<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulse {
        0% { transform: scale(0.9); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 0.35; }
        100% { transform: scale(0.9); opacity: 0.8; }
      }
      @keyframes ripple {
        0% { r: 14px; opacity: 0.7; }
        100% { r: 24px; opacity: 0; }
      }
      .cursor-dot {
        transform-origin: center;
        animation: pulse 1.6s ease-in-out infinite;
      }
      .cursor-ring {
        transform-origin: center;
        animation: ripple 1.6s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .cursor-dot, .cursor-ring { animation: none; }
      }
    </style>
    <clipPath id="phone-screen-1">
      <rect x="20" y="10" width="280" height="460" rx="36" />
    </clipPath>
  </defs>

  <!-- Phone outer chassis -->
  <rect x="20" y="10" width="280" height="460" rx="36" fill="#000000" stroke="#2c2c2e" stroke-width="3" />

  <g clip-path="url(#phone-screen-1)">
    <!-- App background -->
    <rect x="20" y="10" width="280" height="460" fill="#000000" />

    <!-- Top notch / Dynamic Island -->
    <rect x="120" y="20" width="80" height="18" rx="9" fill="#1c1c1e" />

    <!-- Schematic app content -->
    <rect x="44" y="58" width="80" height="14" rx="4" fill="#ffffff" opacity="0.9" />
    <rect x="44" y="82" width="232" height="74" rx="16" fill="#1c1c1e" />
    <rect x="58" y="98" width="120" height="10" rx="3" fill="#2c2c2e" />
    <rect x="58" y="118" width="70" height="8" rx="3" fill="#38383a" />

    <rect x="44" y="168" width="232" height="110" rx="16" fill="#1c1c1e" />
    <rect x="58" y="186" width="140" height="10" rx="3" fill="#2c2c2e" />
    <rect x="58" y="206" width="90" height="8" rx="3" fill="#38383a" />
    <rect x="58" y="226" width="110" height="8" rx="3" fill="#38383a" />

    <rect x="44" y="290" width="232" height="80" rx="16" fill="#1c1c1e" />

    <!-- Safari bottom toolbar -->
    <rect x="20" y="420" width="280" height="50" fill="#1c1c1e" />
    <line x1="20" y1="420" x2="300" y2="420" stroke="#2c2c2e" stroke-width="1" />

    <!-- Safari back arrow -->
    <path d="M 52 445 L 42 445 M 47 440 L 42 445 L 47 450" fill="none" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Safari forward arrow -->
    <path d="M 92 445 L 102 445 M 97 440 L 102 445 L 97 450" fill="none" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Safari Share icon (target) at x=160, y=445 -->
    <g id="share-icon">
      <!-- Up arrow -->
      <path d="M 160 447 L 160 435 M 155 440 L 160 435 L 165 440" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Open box -->
      <path d="M 152 442 L 152 451 A 2 2 0 0 0 154 453 L 166 453 A 2 2 0 0 0 168 451 L 168 442" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Safari bookmarks icon -->
    <path d="M 224 438 L 234 438 L 234 452 L 229 448 L 224 452 Z" fill="none" stroke="#8e8e93" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Safari tabs icon -->
    <rect x="262" y="438" width="13" height="13" rx="3" fill="none" stroke="#8e8e93" stroke-width="1.8" />

    <!-- The cursor dot over the Share icon at (160, 444) -->
    <g transform="translate(160, 444)">
      <circle class="cursor-ring" cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="1.5" />
      <circle class="cursor-dot" cx="0" cy="0" r="14" fill="#ffffff" fill-opacity="0.3" stroke="#ffffff" stroke-width="1.5" />
    </g>
  </g>
</svg>
